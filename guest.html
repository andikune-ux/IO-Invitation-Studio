<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Undangan Digital</title><link rel="stylesheet" href="./styles.css"><style>
.guest-page{background:#f5f1eb;color:#29352e;font-family:Georgia,serif}.guest-card{max-width:760px;margin:22px auto;padding:0 14px 40px}.guest-section{background:#fff;border-radius:18px;padding:22px;margin:14px 0;text-align:center;box-shadow:0 8px 28px #27352b0d}.guest-section h2{font-size:22px;margin:5px 0 14px}.guest-section p{line-height:1.75;white-space:pre-line}.guest-hero,.guest-cover{width:100%;max-height:560px;object-fit:cover;border-radius:18px;display:block}.guest-hero-wrap{position:relative;margin-bottom:14px}.guest-hero-wrap img{width:100%;max-height:650px;object-fit:cover;border-radius:18px}.guest-profile-grid,.guest-gallery,.guest-story-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.guest-profile img,.guest-gallery img,.guest-story img{width:100%;max-height:330px;object-fit:cover;border-radius:12px}.guest-profile h3,.guest-story h3{margin:10px 0 4px}.guest-countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.guest-countdown div{background:#f4f1eb;border-radius:12px;padding:12px 4px}.guest-countdown b{display:block;font:700 24px Arial}.guest-countdown span{font:11px Arial;color:#68736b}.guest-action{display:inline-block;background:#526d5d;color:white;padding:12px 18px;border-radius:24px;text-decoration:none;font:700 13px Arial;margin:8px 0}.guest-bank{border:1px solid #e7e5df;border-radius:12px;padding:14px;margin:10px 0;text-align:left;font:13px Arial}.guest-bank strong,.guest-bank span{display:block;margin:5px 0}.guest-copy{text-align:center;padding:22px}.guest-copy h1{font-size:32px}.guest-empty{max-width:520px;margin:15vh auto;text-align:center;padding:24px}.guest-section video{width:100%;border-radius:12px}.guest-muted{font:12px Arial;color:#7b847d}@media(max-width:520px){.guest-profile-grid,.guest-gallery,.guest-story-grid{grid-template-columns:1fr}.guest-countdown b{font-size:19px}.guest-copy h1{font-size:26px}}
</style></head><body class="guest-page">
<main id="guest-root" class="guest-card" hidden>
 <div id="guest-hero-wrap" class="guest-hero-wrap" hidden><img id="guest-hero" alt="Foto utama undangan"></div>
 <section class="guest-section guest-copy"><small id="guest-category">YOU ARE INVITED</small><p id="guest-recipient" class="guest-recipient"></p><h1 id="guest-title">Undangan</h1><p id="guest-opening"></p><h2 id="guest-names"></h2><div id="guest-family"></div></section>
 <section class="guest-section" id="guest-profiles" hidden><h2 id="guest-profile-heading">Profil</h2><div id="guest-profile-list" class="guest-profile-grid"></div></section>
 <section class="guest-section" id="guest-countdown-section" hidden><h2>Menuju hari acara</h2><div id="guest-countdown" class="guest-countdown"></div></section>
 <section class="guest-section"><h2>Informasi Acara</h2><p id="guest-date"></p><p id="guest-location"></p><a id="guest-map" class="guest-action" target="_blank" rel="noopener noreferrer" hidden>⌖ Buka Google Maps</a></section>
 <section class="guest-section" id="guest-featured-section" hidden><h2>Galeri Foto</h2><div id="guest-featured" class="guest-gallery"></div></section>
 <section class="guest-section" id="guest-cover-section" hidden><h2>Foto Sampul</h2><img id="guest-cover" class="guest-cover" alt="Foto sampul undangan"></section>
 <section class="guest-section" id="guest-video-section" hidden><h2>Video Undangan</h2><video id="guest-video" controls playsinline></video></section>
 <section class="guest-section" id="guest-bank-section" hidden><h2>Hadiah / Rekening</h2><div id="guest-banks"></div></section>
 <section class="guest-section" id="guest-story-section" hidden><h2>Kisah Perjalanan</h2><div id="guest-stories" class="guest-story-grid"></div></section>
 <section class="guest-section"><p id="guest-closing"></p><p class="guest-muted" id="guest-media-link"></p></section>
</main>
<section id="guest-empty" class="guest-empty"><h1 id="guest-error-title">Memuat undangan…</h1><p id="guest-error">Mohon tunggu sebentar.</p><p class="guest-help">Silakan hubungi pengundang untuk mendapatkan tautan undangan yang benar.</p></section>
<script>
(async()=>{
 const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),eventId=params.get('event'),guestId=params.get('guestId'),hash=new URLSearchParams(location.hash.replace(/^#/,'')),inviteToken=hash.get('invite')||'',recipient=params.get('to');
 const set=(id,v)=>{const n=$(id);if(n)n.textContent=v||''},show=(id,on=true)=>{const n=$(id);if(n)n.hidden=!on},img=(id,url,alt)=>{if(!url)return;$(id).src=url;$(id).alt=alt||''};
 const safeMap=url=>{try{const u=new URL(url);return ['google.com','www.google.com','maps.google.com','maps.app.goo.gl'].includes(u.hostname)?u.href:''}catch{return ''}};
 const familyLabels={'groomFather':'Ayah mempelai pria','groomMother':'Ibu mempelai pria','brideFather':'Ayah mempelai wanita','brideMother':'Ibu mempelai wanita','father':'Ayah','mother':'Ibu','host':'Penyelenggara','family':'Keluarga'};
 const renderCountdown=date=>{const target=new Date(date).getTime();if(!Number.isFinite(target))return;show('guest-countdown-section');const node=$('guest-countdown');const tick=()=>{const diff=target-Date.now();if(diff<=0){node.textContent='Acara sedang berlangsung atau telah dimulai';return}const d=Math.floor(diff/86400000),h=Math.floor(diff%86400000/3600000),m=Math.floor(diff%3600000/60000),s=Math.floor(diff%60000/1000);node.innerHTML=[[d,'Hari'],[h,'Jam'],[m,'Menit'],[s,'Detik']].map(x=>'<div><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('')};tick();setInterval(tick,1000)};
 try{
  if(location.hash)history.replaceState(null,'',location.pathname+location.search);
  if(!eventId||!/^[a-z0-9][a-z0-9-]{2,63}$/.test(eventId))throw Error('ID acara tidak valid atau belum diisi.');
  if(guestId){if(!inviteToken)throw Error('Token undangan personal tidak ditemukan.');const check=await fetch('/api/guest/resolve?eventId='+encodeURIComponent(eventId)+'&guestId='+encodeURIComponent(guestId),{headers:{Authorization:'Bearer '+inviteToken,Accept:'application/json'}});const verified=await check.json();if(!check.ok)throw Error(verified.error||'Tautan tamu tidak valid.');set('guest-recipient','Kepada Yth. '+verified.guest.name)}else if(recipient)set('guest-recipient','Kepada Yth. '+recipient);
  const response=await fetch('/api/invitation/'+encodeURIComponent(eventId),{headers:{Accept:'application/json'}}),d=await response.json();if(!response.ok)throw Error(d.error||'Undangan tidak ditemukan.');
  set('guest-title',d.title);set('guest-category',d.category||'YOU ARE INVITED');set('guest-opening',d.opening);set('guest-names',[d.personOne,d.personTwo].filter(Boolean).join(' & '));set('guest-date',d.date?new Date(d.date).toLocaleString('id-ID',{dateStyle:'full',timeStyle:'short'}):'');set('guest-location',d.location);set('guest-closing',d.closing);
  const media=d.mediaUrls||{},content=d.content||{},cfg=content.family||{};
  if(media.hero){img('guest-hero',media.hero,'Foto utama undangan');show('guest-hero-wrap')}
  const family=$('guest-family');Object.entries(cfg).forEach(([key,val])=>{if(!val)return;const p=document.createElement('p');p.textContent=(familyLabels[key]||key)+': '+val;family.append(p)});
  const profiles=[];if(media.child)profiles.push(['Foto anak',media.child]);if(media.groom)profiles.push([d.category==='Lamaran'?'Calon pria':'Mempelai pria',media.groom]);if(media.bride)profiles.push([d.category==='Lamaran'?'Calon wanita':'Mempelai wanita',media.bride]);if(profiles.length){show('guest-profiles');$('guest-profile-list').replaceChildren(...profiles.map(([label,url])=>{const box=document.createElement('div');box.className='guest-profile';const im=document.createElement('img');im.src=url;im.alt=label;const h=document.createElement('h3');h.textContent=label;box.append(im,h);return box}))}
  if(d.date)renderCountdown(d.date);
  const map=safeMap(content.mapUrl);if(map){$('guest-map').href=map;show('guest-map')}
  const featured=[];for(let i=1;i<=Math.min(6,Number(content.featuredCount)||0);i++)if(media['gallery-'+i])featured.push(media['gallery-'+i]);if(featured.length){show('guest-featured-section');$('guest-featured').replaceChildren(...featured.map((url,i)=>{const im=document.createElement('img');im.src=url;im.alt='Foto unggulan '+(i+1);return im}))}
  if(media.cover){img('guest-cover',media.cover,'Foto sampul undangan');show('guest-cover-section')}
  if(media.video){$('guest-video').src=media.video;show('guest-video-section')}
  const accounts=(content.bankAccounts||[]).filter(x=>x&&((x.bank&&x.bank!=='__other')||x.manualBank)&&x.holder&&x.number).slice(0,2);if(accounts.length){show('guest-bank-section');$('guest-banks').replaceChildren(...accounts.map(a=>{const box=document.createElement('div');box.className='guest-bank';const bank=document.createElement('strong');bank.textContent=a.bank==='__other'?(a.manualBank||'Bank lainnya'):a.bank;const holder=document.createElement('span');holder.textContent='Atas nama: '+a.holder;const number=document.createElement('span');number.textContent='No. rekening: '+a.number;const copy=document.createElement('button');copy.className='guest-action';copy.type='button';copy.textContent='Salin nomor rekening';copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(a.number);copy.textContent='Berhasil disalin'}catch{copy.textContent='Tidak dapat menyalin'}});box.append(bank,holder,number,copy);return box}))}
  const stories=(content.stories||[]).slice(0,3).filter(st=>st.text||media['story-'+st.index]);if(stories.length){show('guest-story-section');$('guest-stories').replaceChildren(...stories.map(st=>{const box=document.createElement('div');box.className='guest-story';const url=media['story-'+st.index];if(url){const im=document.createElement('img');im.src=url;im.alt='Kisah sesi '+st.index;box.append(im)}const h=document.createElement('h3');h.textContent=['Awal pertemuan','Menjalin hubungan','Menuju pernikahan'][st.index-1]||('Kisah '+st.index);const p=document.createElement('p');p.textContent=st.text||'';box.append(h,p);return box}))}
  if(d.mediaUrl){const a=document.createElement('a');a.href=d.mediaUrl;a.target='_blank';a.rel='noopener noreferrer';a.className='guest-action';a.textContent='Buka musik / media';$('guest-media-link').replaceChildren(a)}
  show('guest-root');show('guest-empty',false);
 }catch(e){set('guest-error-title','Undangan belum tersedia');set('guest-error',e.message||'Terjadi kesalahan.')}
})();
</script></body></html>
