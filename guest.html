<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>Undangan Digital</title><link rel="stylesheet" href="./styles.css"></head>
<body class="guest-page">
<main id="guest-root" class="guest-card" hidden><div class="guest-cover" id="guest-cover">✦</div><article class="guest-copy"><small>YOU ARE INVITED</small><h1 id="guest-title">Undangan</h1><p id="guest-opening"></p><h2 id="guest-names"></h2><p id="guest-date"></p><p id="guest-location"></p><video id="guest-video" controls playsinline hidden></video><p id="guest-closing"></p></article></main>
<section id="guest-empty" class="guest-empty"><h1 id="guest-error-title">Memuat undangan…</h1><p id="guest-error">Mohon tunggu sebentar.</p><a href="./index.html">Kembali ke IO Invitation Studio</a></section>
<script>
(async()=>{
 const $=id=>document.getElementById(id),eventId=new URLSearchParams(location.search).get('event'),set=(id,value)=>$(id).textContent=value||'';
 try{
  if(!eventId||!/^[a-z0-9][a-z0-9-]{2,63}$/.test(eventId))throw new Error('ID acara tidak valid atau belum diisi.');
  const response=await fetch('/api/invitation/'+encodeURIComponent(eventId),{headers:{Accept:'application/json'}});
  const data=await response.json();if(!response.ok)throw new Error(data.error||'Undangan tidak ditemukan.');
  set('guest-title',data.title);set('guest-opening',data.opening);set('guest-names',[data.personOne,data.personTwo].filter(Boolean).join(' & '));
  set('guest-date',data.date?new Date(data.date).toLocaleString('id-ID'):'');set('guest-location',data.location);set('guest-closing',data.closing);
  if(data.mediaUrls?.cover){const img=document.createElement('img');img.src=data.mediaUrls.cover;img.alt='Foto undangan';$('guest-cover').replaceChildren(img)}
  if(data.mediaUrls?.video){$('guest-video').src=data.mediaUrls.video;$('guest-video').hidden=false}
  $('guest-root').hidden=false;$('guest-empty').hidden=true;
 }catch(error){set('guest-error-title','Undangan belum tersedia');set('guest-error',error.message||'Terjadi kesalahan saat memuat undangan.')}
})();
</script></body></html>
