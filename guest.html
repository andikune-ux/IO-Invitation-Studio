<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>Undangan Digital</title><link rel="stylesheet" href="./styles.css"></head>
<body class="guest-page">
<main id="guest-root" class="guest-card" hidden><div class="guest-cover" id="guest-cover">✦</div><article class="guest-copy"><small>YOU ARE INVITED</small><p id="guest-recipient" class="guest-recipient"></p><h1 id="guest-title">Undangan</h1><p id="guest-opening"></p><h2 id="guest-names"></h2><p id="guest-date"></p><p id="guest-location"></p><video id="guest-video" controls playsinline hidden></video><p id="guest-closing"></p></article></main>
<section id="guest-empty" class="guest-empty"><h1 id="guest-error-title">Memuat undangan…</h1><p id="guest-error">Mohon tunggu sebentar.</p><a href="./index.html">Kembali ke IO Invitation Studio</a></section>
<script>
(async()=>{
 const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),eventId=params.get('event'),guestId=params.get('guestId'),hash=new URLSearchParams(location.hash.replace(/^#/,'')),inviteToken=hash.get('invite')||'',recipient=params.get('to'),set=(id,value)=>$(id).textContent=value||'';
 if(location.hash)history.replaceState(null,'',location.pathname+location.search);
 if(recipient)set('guest-recipient','Kepada Yth. '+recipient);
 const show=()=>{$('guest-root').hidden=false;$('guest-empty').hidden=true};
 try{
  if(eventId==='demo'){
   const KEY='io-invitation-demo-v1',DB='io-invitation-media-demo';let d={};try{d=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{}
   if(d['event-title']){
    set('guest-title',d['event-title']);set('guest-opening',d['opening-text']);set('guest-names',[d['person-one'],d['person-two']].filter(Boolean).join(' & '));
    set('guest-date',d['event-date']?new Date(d['event-date']).toLocaleString('id-ID'):'');set('guest-location',d['event-location']);set('guest-closing',d['closing-text']);
    const db=await new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
    for(const [key,id] of [[d.mediaKeys?.cover,'guest-cover'],[d.mediaKeys?.video,'guest-video']])if(key){const blob=await new Promise((resolve,reject)=>{const q=db.transaction('media').objectStore('media').get(key);q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});if(blob){const objectUrl=URL.createObjectURL(blob);if(id==='guest-video'){$(id).src=objectUrl;$(id).hidden=false}else{const img=document.createElement('img');img.src=objectUrl;img.alt='Foto undangan';$(id).replaceChildren(img)}}}db.close();show();return;
   }
  }
  if(!eventId||!/^[a-z0-9][a-z0-9-]{2,63}$/.test(eventId))throw new Error('ID acara tidak valid atau belum diisi.');
  if(guestId){
   if(!inviteToken)throw new Error('Token undangan personal tidak ditemukan.');
   const check=await fetch('/api/guest/resolve?eventId='+encodeURIComponent(eventId)+'&guestId='+encodeURIComponent(guestId),{headers:{Authorization:'Bearer '+inviteToken,Accept:'application/json'}});
   const verified=await check.json();if(!check.ok)throw new Error(verified.error||'Tautan tamu tidak valid.');
   set('guest-recipient','Kepada Yth. '+verified.guest.name);
  }
  const response=await fetch('/api/invitation/'+encodeURIComponent(eventId),{headers:{Accept:'application/json'}});
  const d=await response.json();if(!response.ok)throw new Error(d.error||'Undangan tidak ditemukan.');
  set('guest-title',d.title);set('guest-opening',d.opening);set('guest-names',[d.personOne,d.personTwo].filter(Boolean).join(' & '));set('guest-date',d.date?new Date(d.date).toLocaleString('id-ID'):'');set('guest-location',d.location);set('guest-closing',d.closing);
  if(d.mediaUrls?.cover){const img=document.createElement('img');img.src=d.mediaUrls.cover;img.alt='Foto undangan';$('guest-cover').replaceChildren(img)}
  if(d.mediaUrls?.video){$('guest-video').src=d.mediaUrls.video;$('guest-video').hidden=false}show();
 }catch(e){set('guest-error-title','Undangan belum tersedia');set('guest-error',e.message||'Terjadi kesalahan.')}
})();
</script></body></html>
